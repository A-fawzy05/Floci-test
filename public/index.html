<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floci Chat</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<section id="auth-view" class="view">
  <div class="auth-card">
    <h1>Floci Chat</h1>
    <p class="subtitle">Real-time chat over Floci (Cognito · DynamoDB · S3 · ws)</p>

    <form id="login-form" class="auth-form">
      <h2>Log in</h2>
      <input type="text" id="login-username" placeholder="Username" required autocomplete="username">
      <input type="password" id="login-password" placeholder="Password" required autocomplete="current-password">
      <button type="submit">Log in</button>
      <p class="switch">No account? <a href="#" id="go-signup">Sign up</a></p>
    </form>

    <form id="signup-form" class="auth-form hidden">
      <h2>Sign up</h2>
      <input type="text" id="signup-username" placeholder="Username" required autocomplete="username">
      <input type="email" id="signup-email" placeholder="Email" required autocomplete="email">
      <input type="password" id="signup-password" placeholder="Password" required autocomplete="new-password">
      <button type="submit">Sign up</button>
      <p class="switch">Have an account? <a href="#" id="go-login">Log in</a></p>
    </form>

    <p id="auth-error" class="error hidden"></p>
  </div>
</section>

<section id="chat-view" class="view hidden">
  <aside class="sidebar">
    <div class="sidebar-header">
      <span id="me-name"></span>
      <button id="logout-btn" title="Log out">Log out</button>
    </div>
    <ul id="user-list" class="user-list"></ul>
  </aside>

  <main class="chat-main">
    <header class="chat-header">
      <span id="chat-with">Select a user to start chatting</span>
    </header>
    <ul id="message-list" class="message-list"></ul>
    <form id="message-form" class="message-form hidden">
      <input type="file" id="attachment-input" hidden>
      <button type="button" id="attach-btn" title="Attach file">📎</button>
      <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off" required>
      <button type="submit">Send</button>
    </form>
  </main>
</section>

<script src="js/api.js"></script>
<script src="js/wsClient.js"></script>
<script src="js/app.js"></script>
</body>
</html>
